<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمارنده شنا با هوش مصنوعی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: white;
        }
        #webcam, #canvas {
            transform: scaleX(-1); /* آینه کردن تصویر */
        }
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .loader {
            border: 6px solid #334155;
            border-top: 6px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto flex flex-col items-center gap-6">
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-2">شمارنده شنا</h1>
            <p class="text-slate-400 text-sm">بدنت رو از کنار به دوربین نشون بده و شنا بزن</p>
        </div>

        <!-- لودینگ -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loading-message" class="text-lg text-slate-300">در حال بارگذاری مدل هوش مصنوعی...</p>
        </div>

        <!-- محتوای اصلی -->
        <div id="main-content" class="hidden w-full flex flex-col lg:flex-row items-center justify-center gap-6">
            
            <!-- دوربین -->
            <div id="canvas-container">
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <canvas id="canvas"></canvas>
            </div>

            <!-- پنل اطلاعات -->
            <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-xs flex flex-col items-center text-center">
                <div class="mb-6">
                    <p class="text-slate-400 text-sm mb-1">تعداد شنا</p>
                    <p id="count" class="text-7xl font-bold text-white">0</p>
                </div>

                <div class="mb-6">
                    <p class="text-slate-400 text-sm mb-1">وضعیت</p>
                    <p id="stage" class="text-2xl font-semibold text-yellow-400">-</p>
                </div>

                <div class="mb-6 w-full">
                    <p class="text-slate-400 text-sm mb-1">پیام</p>
                    <p id="feedback" class="text-base font-medium text-green-400 min-h-[28px]">آماده...</p>
                </div>

                <button id="reset-button" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition">
                    ریست کردن
                </button>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countEl = document.getElementById('count');
        const stageEl = document.getElementById('stage');
        const feedbackEl = document.getElementById('feedback');
        const loadingEl = document.getElementById('loading');
        const loadingMessageEl = document.getElementById('loading-message');
        const mainContentEl = document.getElementById('main-content');
        const resetButton = document.getElementById('reset-button');

        let detector = null;
        let counter = 0;
        let stage = 'up'; // up یا down

        // محاسبه زاویه بین سه نقطه
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        // راه‌اندازی دوربین
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'user' }
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => resolve(video);
            });
        }

        // بارگذاری مدل
        async function loadModel() {
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
            };
            detector = await poseDetection.createDetector(model, detectorConfig);
        }

        // حلقه اصلی تشخیص
        async function detectPose() {
            if (!detector) return;

            try {
                const poses = await detector.estimatePoses(video);
                
                // پاک کردن بوم
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (poses && poses.length > 0) {
                    const pose = poses[0];
                    processPushup(pose);
                    drawKeypoints(pose);
                    drawSkeleton(pose);
                }
            } catch (err) {
                console.error(err);
            }

            requestAnimationFrame(detectPose);
        }

        // رسم نقاط
        function drawKeypoints(pose) {
            for (const kp of pose.keypoints) {
                if (kp.score > 0.4) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#22c55e';
                    ctx.fill();
                }
            }
        }

        // رسم اسکلت
        function drawSkeleton(pose) {
            const pairs = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#22c55e';

            pairs.forEach(([i, j]) => {
                const kp1 = pose.keypoints[i];
                const kp2 = pose.keypoints[j];
                if (kp1.score > 0.4 && kp2.score > 0.4) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.stroke();
                }
            });
        }

        // منطق شمارش شنا
        function processPushup(pose) {
            const keypoints = pose.keypoints;

            const leftShoulder = keypoints.find(k => k.name === 'left_shoulder');
            const leftElbow = keypoints.find(k => k.name === 'left_elbow');
            const leftWrist = keypoints.find(k => k.name === 'left_wrist');
            const rightShoulder = keypoints.find(k => k.name === 'right_shoulder');
            const rightElbow = keypoints.find(k => k.name === 'right_elbow');
            const rightWrist = keypoints.find(k => k.name === 'right_wrist');

            // اگر هر دو شانه مشخص باشن، یعنی روبه‌رو ایستاده
            if (leftShoulder.score > 0.5 && rightShoulder.score > 0.5) {
                feedbackEl.textContent = 'لطفاً بدنت رو از کنار به دوربین نشون بده';
                feedbackEl.className = 'text-base font-medium text-yellow-400';
                return;
            }

            // انتخاب دستی که وضوح بهتری داره
            let shoulder, elbow, wrist;
            if (leftShoulder.score > rightShoulder.score) {
                shoulder = leftShoulder;
                elbow = leftElbow;
                wrist = leftWrist;
            } else {
                shoulder = rightShoulder;
                elbow = rightElbow;
                wrist = rightWrist;
            }

            if (shoulder.score > 0.4 && elbow.score > 0.4 && wrist.score > 0.4) {
                const angle = calculateAngle(shoulder, elbow, wrist);

                if (angle > 155) { // دست صاف (بالا)
                    if (stage === 'down') {
                        counter++;
                        feedbackEl.textContent = 'عالی!';
                        feedbackEl.className = 'text-base font-medium text-green-400';
                    }
                    stage = 'up';
                } else if (angle < 95) { // دست خم (پایین)
                    if (stage === 'up') {
                        feedbackEl.textContent = 'برو پایین‌تر...';
                        feedbackEl.className = 'text-base font-medium text-blue-400';
                    }
                    stage = 'down';
                }

                countEl.textContent = counter;
                stageEl.textContent = stage === 'up' ? 'بالا' : 'پایین';
            } else {
                feedbackEl.textContent = 'شانه، آرنج و مچ دستت باید مشخص باشه';
                feedbackEl.className = 'text-base font-medium text-yellow-400';
            }
        }

        // ریست
        resetButton.addEventListener('click', () => {
            counter = 0;
            stage = 'up';
            countEl.textContent = '0';
            stageEl.textContent = '-';
            feedbackEl.textContent = 'شمارنده ریست شد';
            feedbackEl.className = 'text-base font-medium text-slate-300';
        });

        // شروع برنامه
        async function main() {
            try {
                await loadModel();
                loadingMessageEl.textContent = 'لطفاً اجازه دسترسی به دوربین را بدهید...';
                await setupCamera();

                loadingEl.classList.add('hidden');
                mainContentEl.classList.remove('hidden');
                feedbackEl.textContent = 'آماده! شروع کن';
                detectPose();
            } catch (e) {
                loadingMessageEl.textContent = 'خطا: ' + e.message;
                loadingMessageEl.style.color = '#f87171';
            }
        }

        main();
    </script>
</body>
  </html>
