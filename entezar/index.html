<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تایمر شمارش معکوس تا ۱ مرداد ۱۴۰۸</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            width: 100%;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Soft glowing orbs - clipped so they never cause scroll */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
        }
        .orb1 {
            width: 320px; height: 320px;
            background: #00f5ff;
            top: -120px; left: -120px;
            animation: float 14s ease-in-out infinite;
        }
        .orb2 {
            width: 280px; height: 280px;
            background: #7b2ff7;
            bottom: -100px; right: -100px;
            animation: float 17s ease-in-out infinite reverse;
        }
        .orb3 {
            width: 200px; height: 200px;
            background: #ff00aa;
            top: 45%; left: 55%;
            animation: float 11s ease-in-out infinite 1.5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(25px, -30px); }
        }

        /* Stars layer */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 28% 70%, rgba(255,255,255,0.85), transparent),
                radial-gradient(1px 1px at 48% 28%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 72% 78%, rgba(255,255,255,0.75), transparent),
                radial-gradient(1px 1px at 88% 12%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 18% 88%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 92% 52%, #fff, transparent);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 16px 12px;
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* Header */
        .header {
            margin-bottom: 28px;
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(1.45rem, 4.8vw, 2.6rem);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(105deg, #00f5ff, #a855f7, #ff00aa, #00f5ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 5s linear infinite;
            line-height: 1.25;
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.4vw, 1.15rem);
            color: #888;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .target-date {
            display: inline-block;
            background: rgba(0, 245, 255, 0.07);
            border: 1px solid rgba(0, 245, 255, 0.28);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.88rem;
            color: #00f5ff;
            letter-spacing: 0.5px;
        }

        /* Timer */
        .timer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 1.8vw, 14px);
            flex-wrap: wrap;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 18px;
            padding: clamp(12px, 2.8vw, 20px) clamp(10px, 2.2vw, 18px);
            min-width: clamp(68px, 13vw, 110px);
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 245, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 245, 255, 0.15);
        }

        .time-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 18%;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0.6;
        }

        .number {
            font-size: clamp(1.7rem, 6vw, 3.1rem);
            font-weight: 900;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            direction: ltr;
            display: block;
        }

        .time-box:nth-child(1) { color: #c084fc; }
        .time-box:nth-child(1) .number { color: #c084fc; text-shadow: 0 0 18px rgba(192,132,252,0.6); }
        .time-box:nth-child(2) { color: #f472b6; }
        .time-box:nth-child(2) .number { color: #f472b6; text-shadow: 0 0 18px rgba(244,114,182,0.6); }
        .time-box:nth-child(3) { color: #22d3ee; }
        .time-box:nth-child(3) .number { color: #22d3ee; text-shadow: 0 0 18px rgba(34,211,238,0.6); }
        .time-box:nth-child(4) { color: #34d399; }
        .time-box:nth-child(4) .number { color: #34d399; text-shadow: 0 0 18px rgba(52,211,153,0.6); }
        .time-box:nth-child(5) { color: #fbbf24; }
        .time-box:nth-child(5) .number { color: #fbbf24; text-shadow: 0 0 18px rgba(251,191,36,0.6); }
        .time-box:nth-child(6) { color: #f87171; }
        .time-box:nth-child(6) .number { color: #f87171; text-shadow: 0 0 18px rgba(248,113,113,0.6); }

        .label {
            font-size: clamp(0.75rem, 1.9vw, 0.95rem);
            color: #aaa;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Message */
        .message {
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            color: #c4b5fd;
            font-weight: 500;
            min-height: 28px;
            flex-shrink: 0;
        }

        /* Finished */
        .finished {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .finished h2 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            background: linear-gradient(90deg, #00f5ff, #ff00aa, #a855f7, #00f5ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        .finished p {
            font-size: 1.1rem;
            color: #999;
        }

        /* Pulse only on seconds */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .time-box:last-child .number {
            animation: pulse 1s ease-in-out infinite;
        }

        /* Mobile optimizations - no scroll guaranteed */
        @media (max-width: 640px) {
            .header {
                margin-bottom: 20px;
            }
            .timer {
                gap: 6px;
                margin-bottom: 18px;
            }
            .time-box {
                min-width: 58px;
                padding: 10px 6px;
                border-radius: 14px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .time-box {
                min-width: 52px;
                padding: 9px 4px;
            }
            .number {
                font-size: 1.45rem;
            }
            .label {
                font-size: 0.7rem;
            }
        }

        /* Very short screens (landscape phones) */
        @media (max-height: 500px) {
            .header {
                margin-bottom: 12px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .subtitle, .target-date {
                display: none;
            }
            .timer {
                margin-bottom: 10px;
            }
            .time-box {
                padding: 8px 10px;
            }
            .number {
                font-size: 1.5rem;
            }
            .message {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <div class="container">
        <div class="header">
            <h1>شمارش معکوس تا ۱ مرداد ۱۴۰۸</h1>
            <p class="subtitle">شمارش دقیق سال، ماه، روز و زمان باقی‌مانده</p>
            <div class="target-date">هدف: ۱ مرداد ۱۴۰۸</div>
        </div>

        <div class="timer" id="timer">
            <div class="time-box">
                <span class="number" id="years">۰۰</span>
                <div class="label">سال</div>
            </div>
            <div class="time-box">
                <span class="number" id="months">۰۰</span>
                <div class="label">ماه</div>
            </div>
            <div class="time-box">
                <span class="number" id="days">۰۰</span>
                <div class="label">روز</div>
            </div>
            <div class="time-box">
                <span class="number" id="hours">۰۰</span>
                <div class="label">ساعت</div>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">۰۰</span>
                <div class="label">دقیقه</div>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">۰۰</span>
                <div class="label">ثانیه</div>
            </div>
        </div>

        <div class="message" id="message">در حال محاسبه...</div>

        <div class="finished" id="finished">
            <h2>زمان فرا رسید! ✨</h2>
            <p>۱ مرداد ۱۴۰۸ آغاز شد</p>
        </div>
    </div>

    <script>
        // Target: 1 Mordad 1408 = 22 July 2029 00:00:00
        const targetDate = new Date(2029, 6, 22, 0, 0, 0);

        function toPersian(num) {
            return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function pad(num) {
            const n = Math.max(0, num);
            return n < 10 ? '۰' + toPersian(n) : toPersian(n);
        }

        function getRemaining() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) return null;

            let years = targetDate.getFullYear() - now.getFullYear();
            let months = targetDate.getMonth() - now.getMonth();
            let days = targetDate.getDate() - now.getDate();

            if (days < 0) {
                months--;
                const prevMonthLastDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
                days += prevMonthLastDay;
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            return { years, months, days, hours, minutes, seconds };
        }

        function update() {
            const rem = getRemaining();

            if (!rem) {
                document.getElementById('timer').style.display = 'none';
                document.getElementById('message').style.display = 'none';
                document.getElementById('finished').style.display = 'flex';
                return;
            }

            document.getElementById('years').textContent = pad(rem.years);
            document.getElementById('months').textContent = pad(rem.months);
            document.getElementById('days').textContent = pad(rem.days);
            document.getElementById('hours').textContent = pad(rem.hours);
            document.getElementById('minutes').textContent = pad(rem.minutes);
            document.getElementById('seconds').textContent = pad(rem.seconds);

            let msg = '';
            if (rem.years > 0) {
                msg = `${toPersian(rem.years)} سال و ${toPersian(rem.months)} ماه و ${toPersian(rem.days)} روز تا رسیدن`;
            } else if (rem.months > 0) {
                msg = `${toPersian(rem.months)} ماه و ${toPersian(rem.days)} روز تا لحظه موعود`;
            } else if (rem.days > 0) {
                msg = `فقط ${toPersian(rem.days)} روز باقی مانده!`;
            } else {
                msg = 'ساعات پایانی شمارش معکوس...';
            }
            document.getElementById('message').textContent = msg;
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
