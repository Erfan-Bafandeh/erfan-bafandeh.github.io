<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کیلومترسنج</title>
    <!-- Leaflet for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- html2canvas for screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background: #0b1120;
            color: #e8edf5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #131e2f;
            border-radius: 30px;
            padding: 24px;
            border: 1px solid #2a3a52;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: #60a5fa;
        }

        .header .sub {
            font-size: 12px;
            color: #7a8ba5;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: #1f3146;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-family: 'Vazir', Tahoma, sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #e8edf5;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid #2f405a;
        }

        .btn:hover {
            background: #2a3f5a;
            transform: translateY(-2px);
            border-color: #4b6a8f;
        }

        .btn-danger {
            background: #4a1e2a;
            border-color: #712b3b;
            color: #fca5a5;
        }

        .btn-danger:hover {
            background: #6d263a;
            border-color: #a03a4f;
        }

        .btn-success {
            background: #1a4a3a;
            border-color: #2a7a5a;
            color: #86efac;
        }

        .btn-success:hover {
            background: #2a6a4a;
            border-color: #3a9a6a;
        }

        .btn-purple {
            background: #3a1a4a;
            border-color: #5a2a7a;
            color: #c084fc;
        }

        .btn-purple:hover {
            background: #5a2a6a;
            border-color: #7a3a9a;
        }

        .btn-warning {
            background: #4a3a1a;
            border-color: #7a5a2a;
            color: #fcd34d;
        }

        /* Speed Center */
        .speed-center {
            text-align: center;
            padding: 20px;
            background: #0f1928;
            border-radius: 25px;
            border: 1px solid #25364d;
            margin-bottom: 16px;
            position: relative;
        }

        .speed-center .label {
            font-size: 14px;
            color: #8da0bb;
        }

        .speed-center .big-speed {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #f0f4ff, #93bbfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .speed-center .unit {
            font-size: 24px;
            color: #7a8ba5;
        }

        .speed-center .status {
            margin-top: 8px;
            font-size: 14px;
            color: #7a8ba5;
            background: #1a283e;
            padding: 4px 20px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #2f405a;
        }

        .gps-status {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 11px;
            color: #7a8ba5;
            background: #1a283e;
            padding: 4px 12px;
            border-radius: 15px;
            border: 1px solid #2f405a;
        }

        .gps-status.active {
            color: #86efac;
            border-color: #2a7a5a;
        }

        .gps-status.error {
            color: #f87171;
            border-color: #7a2a2a;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: #0f1928;
            border-radius: 16px;
            padding: 10px 8px;
            border: 1px solid #1e3146;
            text-align: center;
        }

        .stat-item .icon {
            font-size: 14px;
            color: #60a5fa;
        }

        .stat-item .label {
            font-size: 10px;
            color: #7a8ba5;
            margin-top: 2px;
        }

        .stat-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #e8edf5;
            margin-top: 2px;
        }

        .stat-item .value small {
            font-size: 11px;
            color: #7a8ba5;
            font-weight: 400;
        }

        .stat-item .icon.purple {
            color: #a78bfa;
        }
        .stat-item .icon.green {
            color: #34d399;
        }
        .stat-item .icon.orange {
            color: #fbbf24;
        }
        .stat-item .icon.red {
            color: #f87171;
        }
        .stat-item .icon.cyan {
            color: #22d3ee;
        }
        .stat-item .icon.pink {
            color: #f472b6;
        }

        /* Map */
        .map-section {
            border-top: 1px solid #1e3146;
            padding-top: 12px;
        }

        .map-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #25364d;
            height: 200px;
        }

        #tripMap {
            width: 100%;
            height: 100%;
            background: #0b1320;
        }

        .map-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #7a8ba5;
            margin-bottom: 6px;
        }

        .map-label span:last-child {
            color: #4a5a72;
            font-size: 10px;
        }

        /* Footer */
        .footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #3a4a62;
            border-top: 1px solid #1a2a3e;
            padding-top: 10px;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #131e2f;
            border-radius: 20px;
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            border: 1px solid #2a3a52;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: #4a1e2a;
            border: none;
            color: #fca5a5;
            font-size: 22px;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .container {
                padding: 14px;
            }
            .speed-center .big-speed {
                font-size: 48px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .controls {
                justify-content: flex-start;
            }
        }

        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .speed-center .big-speed {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="captureArea">

        <!-- Header -->
        <div class="header">
            <div>
                <h1>📊 کیلومترسنج</h1>
                <div class="sub"><i class="far fa-clock"></i> <span id="lastUpdate">در انتظار GPS</span></div>
            </div>
            <div class="controls">
                <button class="btn btn-warning" id="unitBtn"><i class="fas fa-exchange-alt"></i> تبدیل</button>
                <button class="btn btn-purple" id="screenshotBtn"><i class="fas fa-camera"></i> عکس</button>
                <button class="btn btn-danger" id="resetBtn"><i class="fas fa-trash"></i> حذف</button>
                <button class="btn btn-success" id="gpsBtn"><i class="fas fa-play"></i> شروع</button>
            </div>
        </div>

        <!-- Speed -->
        <div class="speed-center">
            <div class="gps-status" id="gpsStatus"><i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> غیرفعال</div>
            <div class="label">سرعت لحظه‌ای</div>
            <div>
                <span class="big-speed" id="instantSpeed">۰</span>
                <span class="unit" id="unitLabel">km/h</span>
            </div>
            <div class="status" id="speedStatus"><i class="fas fa-circle" style="color:#7a8ba5;font-size:8px;"></i> در انتظار GPS</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="icon"><i class="fas fa-bolt"></i></div>
                <div class="label">بیشینه سرعت</div>
                <div class="value" id="maxSpeed">۰ <small>km/h</small></div>
            </div>
            <div class="stat-item">
                <div class="icon"><i class="fas fa-chart-line"></i></div>
                <div class="label">میانگین سرعت</div>
                <div class="value" id="avgSpeed">۰ <small>km/h</small></div>
            </div>
            <div class="stat-item">
                <div class="icon"><i class="fas fa-road"></i></div>
                <div class="label">مسافت</div>
                <div class="value" id="distance">۰ <small>km</small></div>
            </div>
            <div class="stat-item">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div class="label">مدت</div>
                <div class="value" id="duration">۰۰:۰۰:۰۰</div>
            </div>
            <div class="stat-item">
                <div class="icon purple"><i class="fas fa-arrow-left"></i></div>
                <div class="label">چرخش چپ</div>
                <div class="value" id="leftTurns">۰</div>
            </div>
            <div class="stat-item">
                <div class="icon purple"><i class="fas fa-arrow-right"></i></div>
                <div class="label">چرخش راست</div>
                <div class="value" id="rightTurns">۰</div>
            </div>
            <div class="stat-item">
                <div class="icon green"><i class="fas fa-satellite-dish"></i></div>
                <div class="label">دقت GPS</div>
                <div class="value" id="accuracy">۰ <small>m</small></div>
            </div>
            <div class="stat-item">
                <div class="icon cyan"><i class="fas fa-mountain"></i></div>
                <div class="label">ارتفاع</div>
                <div class="value" id="altitude">۰ <small>m</small></div>
            </div>
            <div class="stat-item">
                <div class="icon orange"><i class="fas fa-compass"></i></div>
                <div class="label">جهت</div>
                <div class="value" id="heading">-- <small>°</small></div>
            </div>
            <div class="stat-item">
                <div class="icon red"><i class="fas fa-rocket"></i></div>
                <div class="label">شتاب</div>
                <div class="value" id="acceleration">۰ <small>m/s²</small></div>
            </div>
            <div class="stat-item">
                <div class="icon pink"><i class="fas fa-satellite"></i></div>
                <div class="label">ماهواره</div>
                <div class="value" id="satellites">۰</div>
            </div>
            <div class="stat-item">
                <div class="icon"><i class="fas fa-flag"></i></div>
                <div class="label">وضعیت</div>
                <div class="value" id="tripStatus" style="font-size:14px;">در انتظار</div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-section">
            <div class="map-label">
                <span><i class="fas fa-map-marked-alt" style="color:#60a5fa;"></i> مسیر پیموده شده</span>
                <span><i class="fas fa-arrow-down"></i> اسکرول</span>
            </div>
            <div class="map-wrapper">
                <div id="tripMap"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>کیلومترسنج v2.0</span>
            <span id="footerInfo"><i class="fas fa-circle" style="color:#7a8ba5;font-size:6px;"></i> GPS: غیرفعال</span>
            <span id="coordsInfo"><i class="fas fa-location-dot"></i> -- , --</span>
            <span id="pointsInfo"><i class="fas fa-map-pin"></i> ۰ نقطه</span>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <img id="modalImg" src="" alt="گزارش تصویری" />
            <div class="modal-actions">
                <button class="btn btn-success" id="downloadPng"><i class="fas fa-download"></i> PNG شفاف</button>
                <button class="btn btn-purple" id="downloadJpg"><i class="fas fa-download"></i> JPG</button>
                <button class="btn btn-warning" id="modalClose2"><i class="fas fa-times"></i> بستن</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // Data
            // ============================================================
            let trip = {
                maxSpeed: 0,
                avgSpeed: 0,
                instantSpeed: 0,
                distance: 0,
                duration: 0,
                leftTurns: 0,
                rightTurns: 0,
                pathPoints: [],
                prevPos: null,
                prevHeading: null,
                isActive: false,
                maxAlt: 0,
                minAlt: 9999,
                totalAscent: 0,
                totalDescent: 0,
                acceleration: 0,
                prevSpeed: 0,
                prevSpeedTime: null,
                maxAccel: 0,
                maxDecel: 0,
                movingTime: 0,
                stoppedTime: 0,
                isMoving: false,
                lastStopTime: null,
                lastTime: null,
                startTime: null,
            };

            let isKm = true;
            let gpsId = null;
            let isGpsOn = false;
            let map = null;
            let polyline = null;
            let marker = null;
            let updateTimer = null;
            let screenshotData = null;
            let gpsTimeout = null;
            let retryCount = 0;

            // ============================================================
            // DOM refs
            // ============================================================
            const $ = id => document.getElementById(id);
            const el = {
                instantSpeed: $('instantSpeed'),
                unitLabel: $('unitLabel'),
                speedStatus: $('speedStatus'),
                maxSpeed: $('maxSpeed'),
                avgSpeed: $('avgSpeed'),
                distance: $('distance'),
                duration: $('duration'),
                leftTurns: $('leftTurns'),
                rightTurns: $('rightTurns'),
                accuracy: $('accuracy'),
                altitude: $('altitude'),
                heading: $('heading'),
                acceleration: $('acceleration'),
                satellites: $('satellites'),
                tripStatus: $('tripStatus'),
                gpsStatus: $('gpsStatus'),
                lastUpdate: $('lastUpdate'),
                footerInfo: $('footerInfo'),
                coordsInfo: $('coordsInfo'),
                pointsInfo: $('pointsInfo'),
            };

            // ============================================================
            // Helpers
            // ============================================================
            function fmtDur(sec) {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = Math.floor(sec % 60);
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }

            function spd(v) { return isKm ? v : v * 0.621371; }

            function spdUnit() { return isKm ? 'km/h' : 'mph'; }

            function dist(v) { return isKm ? v : v * 0.621371; }

            function distUnit() { return isKm ? 'km' : 'mi'; }

            function spdStr(v) { return `${spd(v).toFixed(1)}`; }

            function distStr(v) { return `${dist(v).toFixed(2)}`; }

            function calcDist(lat1, lng1, lat2, lng2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function detectTurn(prev, curr) {
                if (prev === null) return 0;
                let diff = curr - prev;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                if (Math.abs(diff) > 12) return diff > 0 ? 1 : -1;
                return 0;
            }

            // ============================================================
            // Update UI
            // ============================================================
            function updateUI() {
                el.instantSpeed.textContent = spdStr(trip.instantSpeed);
                el.unitLabel.textContent = spdUnit();

                el.maxSpeed.innerHTML = `${spdStr(trip.maxSpeed)} <small>${spdUnit()}</small>`;
                el.avgSpeed.innerHTML = `${spdStr(trip.avgSpeed)} <small>${spdUnit()}</small>`;
                el.distance.innerHTML = `${distStr(trip.distance)} <small>${distUnit()}</small>`;
                el.duration.textContent = fmtDur(trip.duration);

                el.leftTurns.textContent = trip.leftTurns;
                el.rightTurns.textContent = trip.rightTurns;

                const alt = trip.pathPoints.length > 0 ? trip.pathPoints[trip.pathPoints.length - 1].alt || 0 : 0;
                el.altitude.innerHTML = `${alt.toFixed(1)} <small>m</small>`;

                const hdg = trip.pathPoints.length > 0 ? trip.pathPoints[trip.pathPoints.length - 1].hdg || 0 : 0;
                if (hdg > 0) {
                    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                    const idx = Math.round(((hdg % 360) / 45)) % 8;
                    el.heading.innerHTML = `${hdg.toFixed(0)}° <small>${dirs[idx]}</small>`;
                } else {
                    el.heading.innerHTML = `-- <small>°</small>`;
                }

                el.acceleration.innerHTML = `${trip.acceleration.toFixed(2)} <small>m/s²</small>`;
                el.pointsInfo.textContent = `${trip.pathPoints.length} نقطه`;

                if (!trip.isActive) {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#7a8ba5;font-size:8px;"></i> در انتظار GPS';
                    el.tripStatus.textContent = '⏳ در انتظار';
                    return;
                }

                if (trip.instantSpeed < 0.5) {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> متوقف';
                    el.tripStatus.textContent = '🛑 متوقف';
                } else if (trip.instantSpeed < 20) {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#22c55e;font-size:8px;"></i> حرکت آرام';
                    el.tripStatus.textContent = '🚗 آرام';
                } else if (trip.instantSpeed < 50) {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#facc15;font-size:8px;"></i> حرکت عادی';
                    el.tripStatus.textContent = '🚙 عادی';
                } else if (trip.instantSpeed < 90) {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#f97316;font-size:8px;"></i> سرعت بالا';
                    el.tripStatus.textContent = '🏎️ سریع';
                } else {
                    el.speedStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> سرعت بسیار بالا';
                    el.tripStatus.textContent = '🚀 خیلی سریع';
                }
            }

            function updateMap() {
                if (!map || !polyline || !marker) return;
                if (trip.pathPoints.length < 1) return;
                const pts = trip.pathPoints.map(p => [p.lat, p.lng]);
                polyline.setLatLngs(pts);
                const last = trip.pathPoints[trip.pathPoints.length - 1];
                marker.setLatLng([last.lat, last.lng]);
                map.panTo([last.lat, last.lng], { animate: true, duration: 0.5 });
                el.coordsInfo.textContent = `${last.lat.toFixed(5)} , ${last.lng.toFixed(5)}`;
            }

            // ============================================================
            // GPS Processing
            // ============================================================
            function processGps(pos) {
                if (gpsTimeout) { clearTimeout(gpsTimeout);
                    gpsTimeout = null; }

                const c = pos.coords;
                const lat = c.latitude;
                const lng = c.longitude;
                const speed = (c.speed !== null && c.speed !== undefined) ? c.speed * 3.6 : 0;
                const acc = c.accuracy || 0;
                const alt = (c.altitude !== null && c.altitude !== undefined) ? c.altitude : 0;
                const hdg = (c.heading !== null && c.heading !== undefined) ? c.heading : 0;
                const now = Date.now();

                el.accuracy.innerHTML = `${acc.toFixed(1)} <small>m</small>`;
                if (c.satellites) el.satellites.textContent = c.satellites;

                if (!trip.isActive) {
                    trip.isActive = true;
                    trip.startTime = now;
                    trip.lastTime = now;
                    trip.pathPoints.push({ lat, lng, alt, hdg, speed });
                    trip.prevPos = { lat, lng, alt };
                    trip.prevHeading = hdg;
                    trip.prevSpeed = speed;
                    trip.prevSpeedTime = now;
                    el.gpsStatus.className = 'gps-status active';
                    el.gpsStatus.innerHTML = '<i class="fas fa-circle" style="color:#22c55e;font-size:8px;"></i> فعال';
                    el.footerInfo.innerHTML = '<i class="fas fa-circle" style="color:#22c55e;font-size:6px;"></i> GPS: فعال';
                    el.lastUpdate.textContent = `آخرین بروزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`;
                    retryCount = 0;
                    updateUI();
                    updateMap();
                    return;
                }

                const dt = (now - trip.lastTime) / 1000;
                if (dt > 0 && dt < 5) {
                    trip.duration += dt;
                    if (speed < 0.5) {
                        if (trip.isMoving) { trip.isMoving = false;
                            trip.lastStopTime = now; }
                        if (trip.lastStopTime) trip.stoppedTime += dt;
                    } else {
                        if (!trip.isMoving) {
                            trip.isMoving = true;
                            if (trip.lastStopTime) {
                                trip.stoppedTime += (now - trip.lastStopTime) / 1000;
                                trip.lastStopTime = null;
                            }
                        }
                        trip.movingTime += dt;
                    }
                }

                const prev = trip.prevPos;
                const d = calcDist(prev.lat, prev.lng, lat, lng);
                trip.distance += d;
                trip.instantSpeed = speed;
                if (speed > trip.maxSpeed) trip.maxSpeed = speed;
                if (trip.duration > 0) trip.avgSpeed = trip.distance / (trip.duration / 3600);

                if (alt > 0) {
                    if (alt > trip.maxAlt) trip.maxAlt = alt;
                    if (alt < trip.minAlt) trip.minAlt = alt;
                    if (trip.prevPos.alt > 0) {
                        const diff = alt - trip.prevPos.alt;
                        if (diff > 0.5) trip.totalAscent += diff;
                        else if (diff < -0.5) trip.totalDescent += Math.abs(diff);
                    }
                }

                if (trip.prevSpeedTime) {
                    const ddt = (now - trip.prevSpeedTime) / 1000;
                    if (ddt > 0.1) {
                        const a = (speed - trip.prevSpeed) / ddt / 3.6;
                        trip.acceleration = a;
                        if (a > trip.maxAccel) trip.maxAccel = a;
                        if (a < trip.maxDecel) trip.maxDecel = a;
                    }
                }
                trip.prevSpeed = speed;
                trip.prevSpeedTime = now;

                if (hdg > 0 && trip.prevHeading !== null) {
                    const turn = detectTurn(trip.prevHeading, hdg);
                    if (turn === 1) trip.rightTurns += 1;
                    else if (turn === -1) trip.leftTurns += 1;
                }
                trip.prevHeading = hdg;

                trip.pathPoints.push({ lat, lng, alt, hdg, speed });
                if (trip.pathPoints.length > 500) trip.pathPoints = trip.pathPoints.slice(-300);

                trip.prevPos = { lat, lng, alt };
                trip.lastTime = now;

                el.lastUpdate.textContent = `آخرین بروزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`;
                el.footerInfo.innerHTML =
                `<i class="fas fa-circle" style="color:#22c55e;font-size:6px;"></i> GPS: فعال | ${trip.pathPoints.length} نقطه`;
                retryCount = 0;
                updateUI();
                updateMap();

                gpsTimeout = setTimeout(() => {
                    if (isGpsOn) {
                        el.gpsStatus.className = 'gps-status error';
                        el.gpsStatus.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f87171;font-size:8px;"></i> Timeout!';
                        el.footerInfo.innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:6px;"></i> GPS: قطع شد';
                        reconnectGps();
                    }
                }, 10000);
            }

            function gpsError(err) {
                console.error('GPS Error:', err);
                if (err.code === 3) {
                    retryCount++;
                    if (retryCount < 5) {
                        setTimeout(() => { if (isGpsOn) reconnectGps(); }, 2000 * retryCount);
                    } else {
                        alert('GPS متصل نشد. لطفاً:\n1. GPS را روشن کنید\n2. از Chrome استفاده کنید\n3. در فضای باز باشید');
                        stopGps();
                    }
                } else {
                    el.gpsStatus.className = 'gps-status error';
                    el.gpsStatus.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f87171;font-size:8px;"></i> خطا';
                }
            }

            function reconnectGps() {
                if (!isGpsOn) return;
                if (gpsId !== null) { navigator.geolocation.clearWatch(gpsId);
                    gpsId = null; }
                el.gpsStatus.className = 'gps-status';
                el.gpsStatus.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:#facc15;font-size:8px;"></i> در حال اتصال مجدد...';
                gpsId = navigator.geolocation.watchPosition(processGps, gpsError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 5000,
                });
            }

            // ============================================================
            // GPS Control
            // ============================================================
            function startGps() {
                if (isGpsOn) { stopGps(); return; }
                if (!navigator.geolocation) { alert('مرورگر از GPS پشتیبانی نمی‌کند.'); return; }

                navigator.permissions.query({ name: 'geolocation' }).then(res => {
                    if (res.state === 'denied') {
                        alert('دسترسی GPS مسدود شده. لطفاً مجوز را فعال کنید.');
                        return;
                    }
                    retryCount = 0;
                    gpsId = navigator.geolocation.watchPosition(processGps, gpsError, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 5000,
                    });
                    isGpsOn = true;
                    $('gpsBtn').innerHTML = '<i class="fas fa-stop"></i> توقف';
                    el.gpsStatus.className = 'gps-status';
                    el.gpsStatus.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:#facc15;font-size:8px;"></i> در حال دریافت...';
                    el.lastUpdate.textContent = 'در حال دریافت GPS...';
                    el.footerInfo.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:#facc15;font-size:6px;"></i> GPS: در حال اتصال';

                    if (updateTimer) clearInterval(updateTimer);
                    updateTimer = setInterval(() => { if (trip.isActive) updateUI(); }, 1000);

                    setTimeout(() => {
                        if (isGpsOn && !trip.isActive) {
                            el.gpsStatus.className = 'gps-status error';
                            el.gpsStatus.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f87171;font-size:8px;"></i> Timeout!';
                            alert('GPS Timeout! لطفاً دوباره تلاش کنید.');
                            stopGps();
                        }
                    }, 15000);
                });
            }

            function stopGps() {
                if (gpsId !== null) { navigator.geolocation.clearWatch(gpsId);
                    gpsId = null; }
                if (gpsTimeout) { clearTimeout(gpsTimeout);
                    gpsTimeout = null; }
                isGpsOn = false;
                $('gpsBtn').innerHTML = '<i class="fas fa-play"></i> شروع';
                el.gpsStatus.className = 'gps-status';
                el.gpsStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> غیرفعال';
                el.footerInfo.innerHTML = '<i class="fas fa-circle" style="color:#7a8ba5;font-size:6px;"></i> GPS: غیرفعال';
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }
                retryCount = 0;
            }

            // ============================================================
            // Reset
            // ============================================================
            function resetTrip() {
                stopGps();
                trip = {
                    maxSpeed: 0,
                    avgSpeed: 0,
                    instantSpeed: 0,
                    distance: 0,
                    duration: 0,
                    leftTurns: 0,
                    rightTurns: 0,
                    pathPoints: [],
                    prevPos: null,
                    prevHeading: null,
                    isActive: false,
                    maxAlt: 0,
                    minAlt: 9999,
                    totalAscent: 0,
                    totalDescent: 0,
                    acceleration: 0,
                    prevSpeed: 0,
                    prevSpeedTime: null,
                    maxAccel: 0,
                    maxDecel: 0,
                    movingTime: 0,
                    stoppedTime: 0,
                    isMoving: false,
                    lastStopTime: null,
                    lastTime: null,
                    startTime: null,
                };
                if (polyline) polyline.setLatLngs([]);
                if (marker) marker.setLatLng([35.6892, 51.3890]);
                if (map) map.panTo([35.6892, 51.3890]);
                el.gpsStatus.className = 'gps-status';
                el.gpsStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> غیرفعال';
                el.accuracy.innerHTML = '۰ <small>m</small>';
                el.satellites.textContent = '۰';
                el.coordsInfo.textContent = '-- , --';
                el.footerInfo.innerHTML = '<i class="fas fa-circle" style="color:#7a8ba5;font-size:6px;"></i> GPS: غیرفعال';
                el.lastUpdate.textContent = 'در انتظار GPS';
                el.pointsInfo.textContent = '۰ نقطه';
                screenshotData = null;
                updateUI();
                $('gpsBtn').innerHTML = '<i class="fas fa-play"></i> شروع';
                isGpsOn = false;
            }

            // ============================================================
            // Unit Toggle
            // ============================================================
            function toggleUnit() {
                isKm = !isKm;
                $('unitBtn').innerHTML = `<i class="fas fa-exchange-alt"></i> ${isKm ? 'به مایل' : 'به کیلومتر'}`;
                updateUI();
            }

            // ============================================================
            // Screenshot
            // ============================================================
            function takeScreenshot() {
                if (trip.pathPoints.length < 2) {
                    alert('هنوز داده‌ای برای عکس وجود ندارد.');
                    return;
                }

                const btn = $('screenshotBtn');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ساخت...';
                btn.disabled = true;

                const el = document.getElementById('captureArea');

                html2canvas(el, {
                    scale: 3,
                    backgroundColor: '#0b1120',
                    allowTaint: true,
                    useCORS: true,
                    logging: false,
                    width: el.scrollWidth,
                    height: el.scrollHeight,
                    windowWidth: el.scrollWidth,
                    windowHeight: el.scrollHeight,
                }).then(canvas => {
                    screenshotData = canvas.toDataURL('image/png');
                    document.getElementById('modalImg').src = screenshotData;
                    document.getElementById('modal').classList.add('show');
                    btn.innerHTML = orig;
                    btn.disabled = false;
                }).catch(err => {
                    alert('خطا در ساخت عکس');
                    btn.innerHTML = orig;
                    btn.disabled = false;
                });
            }

            function downloadPng() {
                if (!screenshotData) { alert('ابتدا عکس را بگیرید.'); return; }
                const a = document.createElement('a');
                a.download = `trip_${new Date().toISOString().slice(0,10)}.png`;
                a.href = screenshotData;
                a.click();
            }

            function downloadJpg() {
                if (!screenshotData) { alert('ابتدا عکس را بگیرید.'); return; }
                const img = new Image();
                img.onload = function() {
                    const c = document.createElement('canvas');
                    c.width = img.width;
                    c.height = img.height;
                    const ctx = c.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const a = document.createElement('a');
                    a.download = `trip_${new Date().toISOString().slice(0,10)}.jpg`;
                    a.href = c.toDataURL('image/jpeg', 0.95);
                    a.click();
                };
                img.src = screenshotData;
            }

            function closeModal() {
                document.getElementById('modal').classList.remove('show');
            }

            // ============================================================
            // Map
            // ============================================================
            function initMap() {
                map = L.map('tripMap', {
                    center: [35.6892, 51.3890],
                    zoom: 15,
                    zoomControl: true,
                });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap, CartoDB',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(map);
                polyline = L.polyline([], { color: '#60a5fa', weight: 4, opacity: 0.85 }).addTo(map);
                const icon = L.divIcon({
                    html: '<i class="fas fa-car" style="font-size:26px;color:#60a5fa;filter:drop-shadow(0 0 8px #3b82f6);"></i>',
                    className: '',
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                marker = L.marker([35.6892, 51.3890], { icon }).addTo(map);
                setTimeout(() => map.invalidateSize(), 300);
            }

            // ============================================================
            // Init
            // ============================================================
            function init() {
                initMap();
                $('unitBtn').addEventListener('click', toggleUnit);
                $('resetBtn').addEventListener('click', resetTrip);
                $('gpsBtn').addEventListener('click', startGps);
                $('screenshotBtn').addEventListener('click', takeScreenshot);
                $('downloadPng').addEventListener('click', downloadPng);
                $('downloadJpg').addEventListener('click', downloadJpg);
                $('modalClose').addEventListener('click', closeModal);
                $('modalClose2').addEventListener('click', closeModal);
                document.getElementById('modal').addEventListener('click', function(e) {
                    if (e.target === this) closeModal();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeModal();
                });
                updateUI();
            }

            if (document.readyState === 'complete') init();
            else window.addEventListener('load', init);

            window.addEventListener('beforeunload', stopGps);

        })();
    </script>
